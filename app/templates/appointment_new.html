{% extends "base.html" %}{% block body %}
<h1>Schedule appointment</h1><p class="sub">One pet and one veterinarian per appointment; a veterinarian cannot be double-booked.</p>
<form method="post" class="card"><div class="row">
<div><label>Pet *</label><select name="pet_id" required><option value="">Select...</option>{% for p in pets %}<option value="{{ p.pet_id }}" {{ 'selected' if pre==p.pet_id|string }}>{{ p.name }}</option>{% endfor %}</select></div>
<div><label>Veterinarian *</label><select name="vet_id" required><option value="">Select...</option>{% for v in vets %}<option value="{{ v.vet_id }}">{{ v.name }}</option>{% endfor %}</select></div>
<div><label>Date *</label><input type="date" name="date" required></div><div><label>Time *</label><input type="time" name="time" step="900" required></div>
<div><label>Duration (min)</label><input type="number" name="duration_min" value="30" min="5"></div><div><label>Reason *</label><input name="reason" required></div></div>
<p><button class="btn">Schedule</button> <a class="btn sec" href="{{ url_for('appointments') }}">Cancel</a></p></form>{% endblock %}
